# Переменные окружения этой копии ai-workflow.
# Скопируй в $ROOT/env.yaml и заполни под свою машину. Файл env.yaml не коммитится.
# $ROOT вычисляется автоматически: это папка, в которой лежит AGENTS.md.
# В любом значении можно писать ${ROOT}, ${TMP_DIR}, ${SECRETS_FILE}, ${PROXY_DIR}, ${PROXY_URL}
# и ${ИМЯ} для любого ключа из vars. Схема файла: rules/config.md, раздел 2.

# Папка для временных файлов агента. Единственное место вне $ROOT и источников, куда агент пишет без разрешения.
tmp_dir: /tmp/opencode

# Файл с секретами (схема: templates/secrets.yaml). Не коммитится.
secrets_file: ${ROOT}/secrets.yaml

# Прокси стендов (infra/nginx-env). Если стенды не нужны, оставь null в обоих полях.
proxy:
  # Папка с bin/envctl. Можно указать папку другой копии ai-workflow, если nginx уже запущен оттуда.
  dir: ${ROOT}/infra/nginx-env
  # Внешний адрес, по которому пользователь открывает прокси (хост и порт снаружи контейнера).
  url: http://localhost:10002

# Свои переменные. Имя: латиница в верхнем регистре, цифры, _. Используются в ws.yaml как ${ИМЯ}.
vars:
  FRONTEND_CODE: /path/to/frontend/code
  BACKEND_CODE: /path/to/backend/code
