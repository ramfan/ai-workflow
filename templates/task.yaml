# Настройки задачи. Лежит в workspaces/<ws>/tasks/<задача>/task.yaml. Схема: rules/config.md, раздел 4.
# Заполняет человек. Агент этот файл не меняет.

# Файл с описанием задачи (относительно папки задачи).
issue: task.md

# Ключ задачи в трекере, например TASK-406. null - нет.
jira: null

# Стадия:
#   research  - исследование. Worktree без ветки, только чтение. Коммиты и push запрещены.
#   plan      - исследование и план. То же, что research; результат - документы с планом в папке задачи.
#   implement - реализация. Worktree на ветке задачи, правки, коммиты и push по настройкам ниже.
stage: research

# Вести журнал выполнения в journal/ (rules/journal.md).
journal: true

git:
  # От какой ветки создаётся ветка задачи. В стадии research/plan - какую ветку исследовать, если branch пуст.
  base_branch: master
  # Ветка задачи. Одно имя во всех репозиториях и подмодулях задачи. null - не задана (для implement обязательна).
  branch: null
  # Ветка задачи в корневом репозитории (для пространств с подмодулями):
  #   true  - ветка создаётся и в корне: коммит с обновлением указателя подмодуля, MR в корне.
  #   false - в корне ветки нет: правки, коммиты и MR только в подмодулях.
  #   null  - как в ws.yaml -> git.root_branch.
  root_branch: null
  # Коммиты: true - разрешены; ask - перед каждым спросить; false - запрещены.
  commit: ask
  # Push и создание merge request: true - разрешены; ask - перед каждым спросить; false - запрещены.
  push: false
  # Заголовок merge request, одинаковый во всех репозиториях задачи. null - MR не создаётся.
  merge_request_title: null
